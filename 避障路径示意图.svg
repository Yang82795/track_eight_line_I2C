 1120.9 L 975.9 1122.0 L 976.5 1123.1 L 977.0 1124.2 L 977.6 1125.3 L 978.2 1126.4 L 978.8 1127.4 L 979.4 1128.4 L 980.0 1129.4 L 980.7 1130.4 L 981.3 1131.4 L 982.0 1132.3 L 982.6 1133.3 L 983.3 1134.2 L 984.0 1135.1 L 984.7 1136.0 L 985.4 1136.8 L 986.1 1137.7 L 986.9 1138.5 L 987.6 1139.3 L 988.4 1140.1 L 989.1 1140.9 L 989.9 1141.6 L 990.7 1142.4 L 991.5 1143.1 L 992.3 1143.8 L 993.2 1144.5 L 994.0 1145.1 L 994.9 1145.8" fill="none" stroke="#4a6f8a" stroke-width="3.2" stroke-dasharray="11 6"/><path d="M 880.4 942.5 L 986.0 958.6" fill="none" stroke="#b06367" stroke-width="50" stroke-linecap="butt" opacity="0.88"/><text x="916" y="1027" class="lbl" text-anchor="middle">障碍</text><g transform="translate(880.0,1000.0) rotate(0.0)"><rect x="-46.0" y="-25.3" width="92.0" height="50.6" rx="2.5" fill="#f2ede3" stroke="#3a4256" stroke-width="1.4"/><line x1="41.9" y1="0" x2="46.0" y2="0" stroke="#b06367" stroke-width="2.2"/></g><text x="880.0" y="966.7" class="lbl" text-anchor="middle">起点</text><g transform="translate(1123.6,973.0) rotate(36.7)"><rect x="-46.0" y="-25.3" width="92.0" height="50.6" rx="2.5" fill="#f2ede3" stroke="#3a4256" stroke-width="1.4"/><line x1="41.9" y1="0" x2="46.0" y2="0" stroke="#b06367" stroke-width="2.2"/></g><text x="1123.6" y="939.7" class="lbl" text-anchor="middle">回到线上</text><text x="300" y="1362" class="ph" text-anchor="middle" fill="#4a6f8a">情况A　障碍在弯道内侧 → 向弯道外侧绕</text><text x="880" y="1362" class="ph" text-anchor="middle" fill="#4a6f8a">情况B　障碍在弯道外侧 → 向弯道内侧绕</text><text x="300" y="1392" class="lg" text-anchor="middle">（代码无需分支：哪侧超声波</text><text x="300" y="1414" class="lg" text-anchor="middle">看到障碍就往另一侧绕）</text><text x="880" y="1392" class="lg" text-anchor="middle">（弯道越靠外，横移需求越小，</text><text x="880" y="1414" class="lg" text-anchor="middle">所以情况B更容易绕开）</text><text x="56" y="1470" class="lg">弯道上代码做三件事：</text><text x="56" y="1500" class="lg">① 绕出与斜行时长按 AVOID_CURVE_SCALE 缩到 70%（弯道本身已在帮着横移，转太多反而过头）</text><text x="56" y="1530" class="lg">② 用 |偏差| 的平滑值自动判定"是否在弯道"，不需要额外传感器</text><text x="56" y="1560" class="lg">③ 找线阶段专门处理"≥5 路黑"：急弯处车身与线接近垂直，此时 err 被判成 0 不可信</text><text x="72" y="1582" class="lg">，只小幅摆正、不猛打方向（否则原地画圈越走越远）</text><line x1="56" y1="1626" x2="94" y2="1626" stroke="#2f6f5e" stroke-width="3.4" stroke-dasharray="11 6"/><text x="102" y="1630" class="lg">① 绕出：向外转约 45°</text><line x1="406" y1="1626" x2="444" y2="1626" stroke="#c97b3f" stroke-width="3.4" stroke-dasharray="11 6"/><text x="452" y="1630" class="lg">② 斜行：双轮等速直走</text><line x1="756" y1="1626" x2="794" y2="1626" stroke="#4a6f8a" stroke-width="3.4" stroke-dasharray="11 6"/><text x="802" y="1630" class="lg">③ 转回：车头重新与线平行</text><text x="56" y="1668" class="lg">核心差别：S 形结束时车头已与黑线平行，第 ④ 步找线只需把车横向拉回线中，而"转 90° 硬绕"结束时车头几乎垂直于线，找线要先转 90° 再找，难度和失败率都高得多。</text><text x="56" y="1694" class="lg">找线分三种状态：1~4 路黑 = 偏差闭环拉回中线；≥5 路黑 = 急弯处车身与线接近垂直（line_pid 把 err 判成 0，不可信），只小幅摆正；全白 = 朝既定方向扇形搜。</text><text x="56" y="1720" class="lg">找线超时也绝不停车，直接交还 PID 边走边找 —— 停下来等于放弃这一轮。</text></svg>